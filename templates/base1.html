<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
      integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/CSS/style.css" />
  </head>
  <body class="bg-light">
    <main class="container-fluid px-3 px-md-4 py-2 py-md-4">
      <div class="card shadow-sm border-0">
        <div class="card-body p-3 p-md-5">
          {% block topbar %}
          <div class="d-flex justify-content-between align-items-center mb-4">
            <button type="button" class="btn btn-outline-secondary btn-sm" title="Меню" aria-label="Открыть меню">
              <i class="bi bi-list"></i>
            </button>
            <div class="d-flex align-items-center gap-3">
              <button type="button" class="btn btn-outline-secondary btn-sm" title="Сообщить об ошибке" aria-label="Сообщить об ошибке" data-bs-toggle="modal" data-bs-target="#bugReportModal">
                <i class="bi bi-bug"></i>
              </button>
              <button type="button" class="btn btn-outline-secondary btn-sm position-relative" title="Уведомления" aria-label="Уведомления">
                <i class="bi bi-bell"></i>
                <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
              </button>
              <button type="button" class="btn p-0 border-0 rounded-circle d-flex align-items-center justify-content-center text-white fw-semibold" style="width: 2.25rem; height: 2.25rem; background-color: #0d6efd;" title="Профиль" aria-label="Профиль">
                {{ (current_user_email or "U")[0] | upper }}
              </button>
            </div>
          </div>

          <div class="modal fade" id="bugReportModal" tabindex="-1" aria-labelledby="bugReportModalLabel" aria-hidden="true">
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header">
                  <h5 class="modal-title" id="bugReportModalLabel">Сообщить об ошибке</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
                </div>
                <div class="modal-body">
                  <div id="bugReportError" class="alert alert-danger d-none" role="alert"></div>
                  <div id="bugReportSuccess" class="alert alert-success d-none" role="alert"></div>
                  <label for="bugReportDescription" class="form-label">Описание ошибки</label>
                  <textarea id="bugReportDescription" class="form-control" rows="4" placeholder="Опишите, что пошло не так..."></textarea>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Отмена</button>
                  <button type="button" id="bugReportSaveBtn" class="btn btn-primary">Сохранить</button>
                </div>
              </div>
            </div>
          </div>
          {% endblock %}
          {% block content %}{% endblock %}
          <footer class="app-footer mt-4 pt-3 border-top text-secondary small d-flex flex-wrap justify-content-between gap-2">
            <span>Infosys Demo</span>
            <span>Bootstrap + FastAPI</span>
          </footer>
        </div>
      </div>
    </main>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="/js/bugreport.js"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
