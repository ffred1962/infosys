<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
      integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/CSS/style.css" />
  </head>
  <body class="bg-light">
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8">
          <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">
              <nav class="d-flex gap-2 flex-wrap mb-4">
                <a class="btn {% if active_page == 'home' %}btn-primary{% else %}btn-outline-primary{% endif %}" href="/proba">Главная</a>
                <a class="btn {% if active_page == 'about' %}btn-primary{% else %}btn-outline-primary{% endif %}" href="/about">О проекте</a>
                <a class="btn {% if active_page == 'contacts' %}btn-primary{% else %}btn-outline-primary{% endif %}" href="/contacts">Контакты</a>
                <a class="btn {% if active_page == 'calculator' %}btn-primary{% else %}btn-outline-primary{% endif %}" href="/calculator">Калькулятор</a>
                <a class="btn {% if active_page == 'request' %}btn-primary{% else %}btn-outline-primary{% endif %}" href="/request">Request</a>
              </nav>
              {% block content %}{% endblock %}
              <footer class="app-footer mt-4 pt-3 border-top text-secondary small d-flex flex-wrap justify-content-between gap-2">
                <span>Infosys Demo</span>
                <span>Bootstrap + FastAPI</span>
              </footer>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
