{% extends "base1.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h1 class="display-6 fw-semibold mb-0">Единицы измерения</h1>
</div>

<div id="unitError" class="alert alert-danger d-none" role="alert"></div>

<div class="table-responsive mb-4">
  <table class="table align-middle">
    <thead class="table-primary">
      <tr>
        <th style="width: 60px;">ID</th>
        <th>Название</th>
        <th style="width: 90px;" class="text-end">Действия</th>
      </tr>
    </thead>
    <tbody id="unitBody">
      {% for u in units %}
      <tr data-unit-id="{{ u.id }}">
        <td>{{ u.id }}</td>
        <td>
          <div class="d-flex gap-1">
            <input type="text" class="form-control form-control-sm unit-name-input" value="{{ u.name }}" required>
            <button type="button" class="btn btn-sm btn-outline-primary unit-save-btn" title="Сохранить" aria-label="Сохранить единицу {{ u.name }}">
              <i class="bi bi-check-lg"></i>
            </button>
          </div>
        </td>
        <td class="text-end">
          <button type="button" class="btn btn-sm btn-outline-danger unit-delete-btn" title="Удалить" aria-label="Удалить единицу {{ u.name }}">
            <i class="bi bi-trash"></i>
          </button>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>

<div class="d-flex gap-1">
  <input type="text" id="unitNewName" class="form-control form-control-sm" placeholder="Новая единица" style="width: auto;" required>
  <button type="button" id="unitAddBtn" class="btn btn-sm btn-outline-success" title="Добавить" aria-label="Добавить единицу">
    <i class="bi bi-plus-lg"></i>
  </button>
</div>

<script src="/js/unit.js"></script>
{% endblock %}
